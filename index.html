<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">

<title>CekBercak</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>/* Layout: satu gagasan per layar, kartu kuning-putih bulat, Dokter Ayu menemani tiap langkah. */
:root{
  color-scheme:light;
  --putih:#FFFFFF;--dasar:#FFFCEB;--lemon:#FFF3B8;--kuning:#FFC928;--emas:#D99A00;--emas-tua:#7A5600;
  --tinta:#3B2F14;--redup:#6B5D3A;--garis:#F0E2A8;
  --merah:#B23A2E;--merah-l:#FFE7E2;--oranye:#A85D00;--oranye-l:#FFE9C9;--hijau:#1F7A4D;--hijau-l:#DFF5E6;
  --f-judul:"Baloo 2","Nunito","Trebuchet MS",sans-serif;--f-isi:"Nunito","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--dasar);color:var(--tinta);font-family:var(--f-isi);font-size:17px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
h1,h2,h3{font-family:var(--f-judul);line-height:1.15;margin:0;text-wrap:balance;font-weight:700}
h1{font-size:clamp(2.1rem,6vw,3.3rem)}h2{font-size:clamp(1.6rem,4.4vw,2.2rem)}h3{font-size:1.25rem}
p{margin:0}a{color:var(--emas-tua);font-weight:700}
:focus-visible{outline:3px solid var(--emas);outline-offset:2px;border-radius:6px}
.bingkai{max-width:760px;margin-inline:auto}
header.atas{max-width:980px;margin-inline:auto;display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:14px}
.merek{font-family:var(--f-judul);font-size:1.5rem;font-weight:800;text-decoration:none;color:var(--tinta)}.merek b{color:var(--emas)}
nav.menu{display:flex;gap:6px;flex-wrap:wrap}
nav.menu a{padding:7px 14px;border-radius:999px;text-decoration:none;color:var(--tinta);font-weight:800;font-size:.95rem}
nav.menu a[aria-current="page"]{background:var(--kuning)}
main{min-height:60vh}
.hal{display:grid;gap:22px;padding-block:14px 30px;animation:masuk .35s ease both}
@keyframes masuk{from{transform:translateY(12px);opacity:.3}to{transform:none;opacity:1}}
.tombol{font:800 1.05rem var(--f-isi);border:0;border-radius:14px;padding:13px 24px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center;color:var(--tinta)}
.t-utama{background:var(--kuning);box-shadow:0 4px 0 var(--emas)}
.t-utama:active{transform:translateY(3px);box-shadow:0 1px 0 var(--emas)}
.t-kedua{background:var(--putih);border:2px solid var(--garis)}
.t-teks{background:none;color:var(--emas-tua);text-decoration:underline;padding:8px}
.deret{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.antara{justify-content:space-between}
.kartu{background:var(--putih);border:2px solid var(--garis);border-radius:20px;padding:20px}
.lembut{color:var(--redup)}.kecil{font-size:.88rem}
.beranda{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:24px;align-items:center;max-width:980px;margin-inline:auto}
.beranda>div{min-width:0;display:grid;gap:16px}
.gambar-utama svg{width:100%;height:auto;display:block}
.janji{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.janji li{display:flex;gap:10px;align-items:flex-start}
.janji i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--lemon);display:grid;place-items:center;font-style:normal;font-weight:800;color:var(--emas-tua)}
.dok-wrap{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:end}
.dok-wrap .dokter{width:96px;height:auto;display:block;animation:ayun 3.4s ease-in-out infinite;transform-origin:bottom center}
.dok-besar{grid-template-columns:150px minmax(0,1fr)}.dok-besar .dokter{width:150px}
@keyframes ayun{50%{transform:translateY(-4px) rotate(1deg)}}
.teman{display:grid;grid-template-columns:104px minmax(0,1fr);gap:14px;align-items:center;background:var(--kuning);border:3px solid var(--tinta);border-radius:20px;padding:10px 16px 0 10px;overflow:hidden}
.teman>div{min-width:0}.teman h2{font-size:clamp(1.45rem,4vw,1.8rem);font-weight:800}.teman p{font-weight:700;padding-bottom:10px}
.teman-wajah{height:112px;overflow:hidden}.teman-wajah .dokter{width:104px;height:auto;display:block}
.gelembung{background:var(--lemon);border-radius:18px 18px 18px 4px;padding:12px 16px;font-weight:700;min-width:0}
.proses{height:10px;background:var(--lemon);border-radius:999px;overflow:hidden}
.proses div{height:100%;background:var(--kuning);transition:width .3s}
.bidang{display:grid;gap:14px}
.isian{display:grid;gap:4px;min-width:0}
.isian label,.lab{font-weight:800;font-size:.95rem}
.isian small{color:var(--redup)}
input:not([type]),input[type=password],input[type=search],input[type=text],input[type=tel],input[type=date],input[type=number],textarea,select{font:inherit;width:100%;padding:11px 12px;border:2px solid var(--garis);border-radius:12px;background:var(--putih);color:var(--tinta);min-width:0}
input:focus,textarea:focus,select:focus{outline:3px solid var(--kuning);outline-offset:0}
.dua{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pil{display:grid;gap:10px}
.pil label{position:relative;display:block;cursor:pointer}
.pil input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.pil span{display:block;padding:13px 16px;border:2px solid var(--garis);border-radius:14px;background:var(--putih);font-weight:800}
.pil input:checked+span{background:var(--kuning);border-color:var(--emas)}
.pil input:focus-visible+span{outline:3px solid var(--emas);outline-offset:2px}
.setuju{display:flex;gap:10px;align-items:flex-start}
.setuju input{width:22px;height:22px;flex:none;margin-top:3px;accent-color:var(--emas)}
.galat{color:var(--merah);font-weight:800}
details.bantu{background:var(--lemon);border-radius:14px;padding:10px 14px}
details.bantu summary{cursor:pointer;font-weight:800}
details.bantu ol{margin:8px 0;padding-left:20px}
.status{display:inline-block;padding:5px 14px;border-radius:999px;font-weight:800}
.tinggi{background:var(--merah-l);color:var(--merah)}.sedang{background:var(--oranye-l);color:var(--oranye)}.rendah{background:var(--hijau-l);color:var(--hijau)}.biasa{background:var(--lemon);color:var(--emas-tua)}
.meter{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.meter b{height:12px;border-radius:6px;background:var(--lemon);display:block}
.meter b.on{background:var(--kuning)}.tinggi-m b.on{background:var(--merah)}.sedang-m b.on{background:#E08A00}.rendah-m b.on{background:var(--hijau)}
.tab{display:flex;gap:6px;flex-wrap:wrap}
.tab button{font:800 .95rem var(--f-isi);border:2px solid var(--garis);background:var(--putih);border-radius:999px;padding:8px 14px;cursor:pointer;color:var(--tinta)}
.tab button[aria-selected="true"]{background:var(--kuning);border-color:var(--emas)}
.alur{list-style:none;margin:0;padding:0;display:grid;gap:0;counter-reset:a}
.alur li{counter-increment:a;display:grid;grid-template-columns:38px minmax(0,1fr);gap:12px;padding-bottom:16px;position:relative}
.alur li::before{content:counter(a);width:38px;height:38px;border-radius:50%;background:var(--kuning);display:grid;place-items:center;font-weight:800}
.alur li:not(:last-child)::after{content:"";position:absolute;left:18px;top:38px;bottom:0;width:2px;background:var(--garis)}
.opsi{border:2px solid var(--garis);border-radius:14px;background:var(--putih);padding:12px 14px}
.opsi[open]{border-color:var(--emas)}.opsi summary{cursor:pointer;font-weight:800}.opsi p{margin-top:6px}
.tagar{display:inline-block;background:var(--lemon);color:var(--emas-tua);font-size:.76rem;font-weight:800;padding:1px 8px;border-radius:999px;margin-left:6px}
.ringkas{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--dasar);border:2px dashed var(--garis);border-radius:12px;padding:12px;font:600 .92rem var(--f-isi);margin:0}
.pintu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pintu a{display:grid;gap:8px;justify-items:center;text-align:center;background:var(--putih);border:2px solid var(--garis);border-radius:22px;padding:24px 14px;text-decoration:none;color:var(--tinta);transition:transform .15s}
.pintu a:hover{transform:translateY(-3px)}.pintu svg{width:90px;height:90px}
video{width:100%;display:block;border-radius:18px;background:var(--tinta);aspect-ratio:16/9;max-width:100%}
.daftar-bab{display:grid;gap:10px}
.daftar-bab a{display:flex;align-items:center;gap:12px;background:var(--putih);border:2px solid var(--garis);border-radius:16px;padding:12px 14px;text-decoration:none;color:var(--tinta);font-weight:800}
.daftar-bab a span{flex:none;width:34px;height:34px;border-radius:50%;background:var(--lemon);display:grid;place-items:center}
.kart-klik{display:grid;gap:10px}
.buka{width:100%;text-align:left;font:800 1.03rem var(--f-isi);background:var(--putih);color:var(--tinta);border:2px solid var(--garis);border-radius:16px;padding:13px 44px 13px 16px;cursor:pointer;position:relative}
.buka::after{content:"+";position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:1.4rem;color:var(--emas);transition:transform .2s}
.buka[aria-expanded="true"]{background:var(--lemon);border-color:var(--emas)}
.buka[aria-expanded="true"]::after{transform:translateY(-50%) rotate(45deg)}
.isi-buka{padding:6px 4px 10px;display:grid;gap:10px;animation:masuk .3s ease both}
.ilus{max-width:260px;width:100%;height:auto;display:block;margin-inline:auto}
.foto-t{font:800 .96rem var(--f-isi);width:100%;background:var(--oranye-l);color:var(--oranye);border:2px dashed #E0B060;border-radius:12px;padding:11px;cursor:pointer}
figure{margin:0;display:grid;gap:6px;animation:masuk .3s ease both}
figure img{width:100%;max-height:440px;object-fit:contain;background:var(--dasar);border-radius:12px;display:block}
figcaption{font-size:.84rem;color:var(--redup)}
.bab-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.balik{perspective:800px;background:none;border:0;padding:0;cursor:pointer;width:100%;font:inherit;color:inherit;text-align:center}
.balik .sisi{display:grid;place-items:center;min-height:120px;padding:14px;border-radius:16px;border:2px solid var(--garis);background:var(--putih);font-weight:800}
.balik[aria-pressed="true"] .sisi{background:var(--hijau-l);border-color:var(--hijau);font-weight:700;animation:kibas .35s ease}
@keyframes kibas{from{transform:rotateY(80deg)}to{transform:none}}
.mitos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.garis-waktu{height:16px;background:var(--lemon);border-radius:999px;position:relative;overflow:hidden}
.garis-waktu div{position:absolute;inset:0 auto 0 0;background:var(--kuning)}
.ceklis{display:grid;gap:8px}
.bintang{display:flex;gap:4px}
.bintang button{background:none;border:0;font-size:2.3rem;line-height:1;cursor:pointer;color:var(--garis);padding:2px}
.bintang button.on{color:var(--kuning)}
footer{max-width:760px;margin:24px auto 0;border-top:2px solid var(--garis);padding-top:14px;font-size:.88rem;color:var(--redup);display:grid;gap:6px}
.bawah{display:none}
@media (max-width:720px){
  nav.menu{display:none}
  .bawah{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--putih);border-top:2px solid var(--garis);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .bawah a{text-align:center;text-decoration:none;color:var(--tinta);font-weight:800;font-size:.78rem;padding:7px 2px;border-radius:10px}
  .bawah a[aria-current="page"]{background:var(--kuning)}
  .beranda{grid-template-columns:minmax(0,1fr)}.gambar-utama{order:-1;max-width:230px;margin-inline:auto}
  .dua,.mitos{grid-template-columns:minmax(0,1fr)}
  .dok-besar{grid-template-columns:110px minmax(0,1fr)}.dok-besar .dokter{width:110px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* --- tokoh kedua, QR, petugas --- */
.nama-t{display:block;font:800 .78rem var(--f-isi);letter-spacing:.06em;text-transform:uppercase;color:var(--emas-tua);margin-bottom:2px}
.teman{grid-template-columns:auto auto minmax(0,1fr)}.teman-wajah{width:92px}.teman-wajah .dokter{width:92px}
.qr-ajak{display:flex;gap:12px;align-items:center;background:var(--putih);border:2px dashed var(--emas);border-radius:16px;padding:10px 14px;color:var(--tinta);text-decoration:none}
.qr-ajak svg{width:38px;height:38px;flex:none}.qr-ajak span{display:grid}.qr-ajak small{color:var(--redup);font-weight:600}
.qr-ajak:hover{background:var(--lemon)}
.poster{max-width:460px;width:100%;border-radius:18px;overflow:hidden;box-shadow:0 6px 24px rgba(59,47,20,.15);border:2px solid var(--garis)}.poster svg{display:block;width:100%;height:auto}
.simpan-info{border-radius:12px;padding:10px 14px;font-weight:700;margin:0}
.s-ok{background:var(--hijau-l);color:var(--hijau)}.s-gagal{background:var(--merah-l);color:var(--merah)}.s-kirim,.s-mati{background:var(--lemon);color:var(--emas-tua)}
.tautan{background:none;border:0;padding:0;font:800 1rem var(--f-isi);color:var(--emas-tua);text-decoration:underline;cursor:pointer}.tautan.merah{color:var(--merah)}
.t-hapus{background:var(--merah);color:#fff;padding:7px 12px;font-size:.9rem}
.sempit{max-width:420px}
.hal.lebar{margin-inline:calc(50% - min(550px, 50vw - 24px))}
.gulir{overflow-x:auto;border:2px solid var(--garis);border-radius:14px;background:var(--putih)}
.tabel-ptg{border-collapse:collapse;width:100%;min-width:760px;font-size:.92rem}
.tabel-ptg th,.tabel-ptg td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--garis);vertical-align:top}
.tabel-ptg th{background:var(--lemon);font-weight:800}
.tabel-ptg summary{cursor:pointer;font-weight:800}.tabel-ptg dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:6px 0 0;font-size:.85rem}.tabel-ptg dt{color:var(--redup)}.tabel-ptg dd{margin:0}
.tabel-ptg .status{font-size:.8rem;padding:3px 10px}.yakin{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:700}
.ringkas-status{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.ringkas-status div{border-radius:14px;padding:10px 12px;display:grid}.ringkas-status b{font:800 1.6rem var(--f-judul)}
.ringkas-status span{font-size:.85rem;font-weight:700}
.petugas-masuk{justify-self:start;background:none;border:2px solid var(--garis);border-radius:999px;padding:6px 14px;color:var(--redup);font-weight:800;text-decoration:none;font-size:.85rem}
@media (max-width:720px){.teman{grid-template-columns:auto auto;padding:10px 12px 0}.teman>div:last-child{grid-column:1/-1}.teman-wajah,.teman-wajah .dokter{width:84px}.teman-wajah{height:100px}}
@media print{@page{size:A4;margin:0}body>*:not(main){display:none!important}main>section>*:not(#poster){display:none!important}main,.hal{padding:0!important;margin:0!important;max-width:none!important}#poster{max-width:none;border:0;box-shadow:none;border-radius:0}}
.kenalan{display:grid;gap:10px}.kenalan .dok-wrap{grid-template-columns:64px minmax(0,1fr)}.kenalan .dokter{width:64px}.kenalan .gelembung{font-size:.95rem}
.kenalan-dua{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kenalan-dua .dok-wrap{grid-template-columns:52px minmax(0,1fr);gap:8px}.kenalan-dua .dokter{width:52px}
.kenalan .bersama{grid-template-columns:auto minmax(0,1fr)}.dua-wajah{display:flex}.dua-wajah .dokter{width:56px}.dua-wajah .dokter+.dokter{margin-left:-8px}
.kenalan .bersama .gelembung{background:var(--kuning)}
</style>
</head>

<header class="atas"><a class="merek" href="#beranda">Cek<b>Bercak</b></a>
<nav class="menu" aria-label="Menu utama"><a data-m-nav="beranda" href="#beranda">Beranda</a><a data-m-nav="pahami" href="#pahami">Pahami Kusta</a><a data-m-nav="penularan" href="#penularan">Penularan</a><a data-m-nav="saran" href="#saran">Saran</a></nav></header>

<script>/* Maskot CekBercak: Dokter Teguh dan Sigma, ilustrasi orisinal */
const _T={kulit:'#C98F62',kulitS:'#D9A27A',tinta:'#3B2F14',putih:'#FFFFFF',rambut:'#33241A',dasi:'#1D1D22',kemeja:'#E4EEF8',hijab:'#F3D27A',hijabG:'#D9AE45'};
function _lengan(pose,warna){const t=_T.tinta,k=pose==='x'?'':'';const L=(d)=>`<path d="${d}" fill="none" stroke="${t}" stroke-width="27" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${warna}" stroke-width="22" stroke-linecap="round"/>`;
 const T=(cx,cy,r=14,kl=_T.kulit)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${kl}" stroke="${t}" stroke-width="2.5"/>`;
 return {kulit:(kl)=>({
  sapa:L('M58 176q-18 14 -16 44')+L('M142 172q26 -14 32 -52')+T(175,110,14,kl),
  semangat:L('M58 172q-26 -12 -30 -50')+T(27,112,14,kl)+L('M142 172q26 -12 30 -50')+T(173,112,14,kl),
  pikir:L('M58 176q-18 14 -16 44')+L('M142 176q24 2 6 -44')+T(141,118,13,kl),
  jempol:L('M58 176q-18 14 -16 44')+L('M142 176q28 -2 34 -36')+T(177,128,14,kl)+`<rect x="172" y="98" width="11" height="26" rx="5.5" fill="${kl}" stroke="${t}" stroke-width="2.5"/>`
 }[pose]||'')}}
function _mulut(pose,bicara,y){return bicara?`<ellipse cx="100" cy="${y+3}" rx="9" ry="8" fill="#8E3B2E"/>`:pose==='pikir'?`<path d="M92 ${y+4}q8 3 16 -1" fill="none" stroke="#7A3B2A" stroke-width="3.5" stroke-linecap="round"/>`:`<path d="M86 ${y-3}q14 17 28 0z" fill="#8E3B2E"/><path d="M89 ${y-2}q11 4 22 0" fill="none" stroke="#fff" stroke-width="3"/>`}
function dokter(pose='sapa',bicara=false){
 const {kulit,tinta,putih,rambut,dasi,kemeja}=_T;
 return `<svg viewBox="0 0 200 244" role="img" aria-label="Ilustrasi Dokter Teguh" class="dokter">
 <path d="M50 244v-62q0 -38 50 -38t50 38v62z" fill="${putih}" stroke="${tinta}" stroke-width="3"/>
 <path d="M80 148l20 30 20 -30v96h-40z" fill="${kemeja}"/>
 <path d="M84 146l16 18 16 -18" fill="${putih}" stroke="${tinta}" stroke-width="2.5" stroke-linejoin="round"/>
 <path d="M95 163h10l3 6 -3 4h-10l-3 -4z" fill="${dasi}"/><path d="M96 172h8l6 46 -10 12 -10 -12z" fill="${dasi}"/>
 <path d="M80 150l-6 30 14 6 -8 50M120 150l6 30 -14 6 8 50" fill="none" stroke="${tinta}" stroke-width="2.5" stroke-linejoin="round"/>
 <rect x="124" y="204" width="18" height="16" rx="3" fill="none" stroke="${tinta}" stroke-width="2"/><path d="M130 198v10" stroke="#2F6FB0" stroke-width="3" stroke-linecap="round"/>

function validasi(fd){
 const t=sesi.tahap,g=[];
 if(t==='setuju'&&(!sesi.j.peran||!sesi.j.setuju))g.push('Pilih untuk siapa cek ini, lalu centang persetujuan.');
 if(t==='diri'){if(!sesi.j.nama?.trim())g.push('Isi nama lengkap.');if(sesi.j.nik&&!/^\d{16}$/.test(sesi.j.nik))g.push('NIK harus 16 angka, atau kosongkan.');if(!sesi.j.jk)g.push('Pilih jenis kelamin.');if(hitungUsia(sesi.j.lahir)===null)g.push('Isi tanggal lahir yang benar.');if(sesi.j.telp&&!/^[0-9+ -]{8,16}$/.test(sesi.j.telp))g.push('Periksa kembali nomor telepon.');}
 if(t==='tubuh'){if(sesi.j.bb&&!(+sesi.j.bb>0&&+sesi.j.bb<=300))g.push('Periksa kembali berat badan.');if(sesi.j.tb&&!(+sesi.j.tb>=30&&+sesi.j.tb<=250))g.push('Periksa kembali tinggi badan.');}
 if(t==='alamat'&&!(sesi.j.kab?.trim()&&sesi.j.kec?.trim()&&sesi.j.kel?.trim()))g.push('Isi kabupaten, kecamatan, dan kelurahan atau desa.');
 if(t==='soal'){const q=soalAktif()[sesi.i];if(!sesi.j[q.id])g.push('Pilih salah satu jawaban.');}
 return g;
}
function maju(){const u=['setuju','diri','tubuh','alamat'],k=u.indexOf(sesi.tahap);
 if(k>=0&&k<3)sesi.tahap=u[k+1];else if(k===3){sesi.tahap='soal';sesi.i=0}
 else if(sesi.tahap==='soal'){if(sesi.i<soalAktif().length-1)sesi.i++;else{sesi.tahap='hasil';sesi.t='hasil';simpanHasil()}}
 gambar();scrollTo(0,0)}
function mundur(){const u=['setuju','diri','tubuh','alamat'],k=u.indexOf(sesi.tahap);
 if(sesi.tahap==='soal'){if(sesi.i>0)sesi.i--;else sesi.tahap='alamat'}else if(k>0)sesi.tahap=u[k-1];gambar();scrollTo(0,0)}

/* ---------- pahami kusta ---------- */
const halPahami=()=>`<section class="hal"><h1>Pahami kusta</h1>${bicara('Mau menonton atau membaca? Pilih yang paling nyaman.')}
 <div class="pintu"><a href="#video"><svg viewBox="0 0 90 90" aria-hidden="true"><circle cx="45" cy="45" r="42" fill="#FFC928"/><path d="M36 28l28 17-28 17z" fill="#3B2F14"/></svg><h3>Tonton video</h3><span class="lembut">Kurang dari 2 menit</span></a>
 <a href="#baca"><svg viewBox="0 0 90 90" aria-hidden="true"><circle cx="45" cy="45" r="42" fill="#FFF3B8"/><path d="M22 28q12-5 23 2v36q-11-7-23-2zM68 28q-12-5-23 2v36q11-7 23-2z" fill="#fff" stroke="#3B2F14" stroke-width="3"/></svg><h3>Baca penjelasan</h3><span class="lembut">${BAB.length} bagian singkat</span></a></div></section>`;
const halVideo=()=>`<section class="hal"><h1>Kenali kusta</h1><video controls playsinline preload="metadata" poster="assets/kenali-kusta.jpg" src="assets/kenali-kusta.mp4" aria-label="Video edukasi kusta bersuara"></video>
 <details class="bantu"><summary>Baca isi video</summary><p>${NARASI}</p></details><div class="deret"><a class="tombol t-utama" href="#cek">Mulai cek</a><a class="tombol t-kedua" href="#baca">Baca selengkapnya</a></div></section>`;
const halBaca=()=>`<section class="hal"><h1>Baca penjelasan</h1><div class="daftar-bab">${BAB.map((b,i)=>`<a href="#bab-${b.id}"><span>${i+1}</span>${b.j}</a>`).join('')}<a href="#bab-mitos"><span>${BAB.length+1}</span>Mitos atau fakta?</a></div></section>`;
function halBab(id){
 if(id==='mitos')return `<section class="hal"><h1>Mitos atau fakta?</h1>${bicara('Ketuk tiap kartu untuk melihat jawabannya.','jempol')}<div class="mitos">${MITOS.map((m,i)=>`<button type="button" class="balik" aria-pressed="false" data-m="${i}"><div class="sisi">${m[0]}</div></button>`).join('')}</div><div class="bab-nav"><a class="tombol t-kedua" href="#baca">Daftar bagian</a><a class="tombol t-utama" href="#cek">Mulai cek</a></div></section>`;
 const i=BAB.findIndex(b=>b.id===id),b=BAB[i];if(!b)return halBaca();const n=BAB[i+1];
 return `<section class="hal"><span class="status biasa">Bagian ${i+1} dari ${BAB.length+1}</span><h1>${b.j}</h1>${bicara(b.ucap,b.pose)}
 <div class="kart-klik">${b.kart.map((k,x)=>`<div><button type="button" class="buka" aria-expanded="false" data-k="${x}">${k.t}</button><div class="isi-buka" hidden>${k.il?ILUS[k.il]:''}<p>${k.p}</p>${k.foto?`<div data-foto="${k.foto}"><button type="button" class="foto-t">Klik untuk melihat gambar asli gejala</button></div>`:''}</div></div>`).join('')}</div>
 ${b.obat?`<div class="bidang">${OBAT.map(([a,c,d])=>`<div class="kartu"><h3>${a}</h3><p>${c}</p><p class="kecil lembut"><b>Yang mungkin dirasakan:</b> ${d}</p></div>`).join('')}</div>`:''}
 <div class="bab-nav"><a class="tombol t-kedua" href="#baca">Daftar bagian</a><a class="tombol t-utama" href="#bab-${n?n.id:'mitos'}">Lanjut</a></div></section>`;
}
function tampilFoto(w,key){const p=FOTO[key];w.innerHTML=`<figure><img src="${f(p.n)}" alt="${esc(p.k)}"><figcaption>${p.k} ${p.c}. <a href="${hal(p.n)}" target="_blank" rel="noopener">Sumber</a></figcaption></figure>`;
 w.querySelector('img').addEventListener('error',e=>{e.target.replaceWith(Object.assign(document.createElement('p'),{textContent:'Foto belum bisa dimuat di sini. Buka tautan sumber di bawah.'}))})}

/* ---------- penularan ---------- */
function halPenularan(){const y=new Date().getFullYear();return `<section class="hal"><h1>Dari mana kusta menular?</h1>${bicara('Tujuannya bukan mencari siapa yang salah, melainkan siapa yang perlu ikut diperiksa.')}
 <div class="kart-klik">
 <div><button type="button" class="buka" aria-expanded="false">Bagaimana cara menularnya?</button><div class="isi-buka" hidden><p>Kusta diduga menular lewat percikan dari hidung dan mulut orang yang belum berobat, saat kontak dekat dan lama.</p></div></div>
 <div><button type="button" class="buka" aria-expanded="false">Siapa yang lebih berisiko?</button><div class="isi-buka" hidden><p>Orang serumah, tetangga dekat, dan teman sekolah atau kerja yang bergaul minimal 20 jam per minggu dengan orang yang belum berobat.</p></div></div>
 <div><button type="button" class="buka" aria-expanded="false">Yang tidak menularkan</button><div class="isi-buka" hidden><p>Bersalaman, berpelukan, makan bersama, dan duduk berdekatan tidak menularkan kusta. Orang yang sudah berobat juga tidak lagi menjadi sumber penularan.</p></div></div>
 </div>
 <div class="kartu bidang"><h2>Kira-kira kapan tertular?</h2><p>Gejala bisa muncul 3 bulan sampai 10 tahun setelah tertular. Karena itu, sumbernya sering tidak diketahui.</p>
 <div class="isian"><label for="thn">Tahun tanda pertama muncul</label><input type="number" id="thn" min="1950" max="${y}" value="${y}" inputmode="numeric"></div>
 <div class="garis-waktu"><div style="width:100%"></div></div><p id="rentang"><b>Kemungkinan tertular: sekitar ${y-10} sampai ${y}.</b></p>
 <p class="lembut">Dalam rentang itu, coba ingat apakah ada orang serumah atau dekat yang pernah berobat kusta, punya bercak mati rasa, atau jari yang berubah bentuk.</p></div>
 <div class="kartu bidang"><h3>Bila ada orang dekat dengan kusta</h3><p>Minta pemeriksaan kontak di puskesmas setahun sekali selama 5 tahun. Tanyakan juga obat pencegahan dosis tunggal, yang hanya diberikan petugas.</p><div class="deret"><a class="tombol t-utama" href="#cek">Mulai cek</a></div></div></section>`}

/* ---------- saran ---------- */
function halSaran(){return `<section class="hal"><h1>Saran dan penilaian</h1>${bicara('Masukan Anda membantu CekBercak menjadi lebih baik. Tidak perlu menulis nama.','jempol')}
 <form id="fs" class="bidang"><div class="bidang"><span class="lab">Seberapa berguna website ini?</span><div class="bintang" role="group" aria-label="Pilih nilai 1 sampai 5">${[1,2,3,4,5].map(n=>`<button type="button" data-b="${n}" aria-label="${n} bintang" class="${n<=saran.b?'on':''}">★</button>`).join('')}</div></div>
 <div class="bidang"><span class="lab">Apakah bahasanya mudah dipahami?</span><div class="dua">${[['ya','Ya, mudah'],['tidak','Masih sulit']].map(([v,l])=>`<div class="pil"><label><input type="radio" name="mudah" id="mudah-${v}" value="${v}"${saran.mudah===v?' checked':''}><span>${l}</span></label></div>`).join('')}</div></div>
 <div class="isian"><label for="stk">Saran Anda</label><textarea id="stk" rows="4">${esc(saran.teks)}</textarea></div>
 <p class="galat" id="galat" role="alert" hidden></p><div class="deret"><button class="tombol t-utama" type="submit">Kirim saran</button></div><p id="info" role="status"></p></form></section>`}
async function kirimSaran(){const g=document.getElementById('galat'),inf=document.getElementById('info');saran.teks=document.getElementById('stk').value;
 if(!saran.b){g.textContent='Pilih nilai bintang dulu.';g.hidden=false;return}g.hidden=true;
 if(!ATUR.SKRIP_URL){inf.textContent='Terima kasih. Penyimpanan saran belum dipasang, jadi saran Anda belum terkirim.';return}
 inf.textContent='Mengirim…';const r=await kirim({aksi:'saran',data:{bintang:saran.b,mudah:saran.mudah,saran:saran.teks}});
 inf.textContent=r.ok?'Terima kasih. Saran Anda sudah terkirim.':'Saran belum terkirim. Periksa internet Anda, lalu coba lagi.'}
const halSumber=()=>`<section class="hal"><h1>Sumber</h1><p>Isi CekBercak disusun dari dokumen berikut. Foto medis berasal dari Wikimedia Commons, dengan pemilik dan lisensi tercantum di setiap foto.</p><ul>${SUMBER.map(([t,u])=>`<li><a href="${u}" target="_blank" rel="noopener">${t}</a></li>`).join('')}</ul><p class="lembut">Video dan ilustrasi dibuat khusus untuk CekBercak. Kode QR dibuat dengan pustaka QR Code karya Kazuhiko Arase (lisensi MIT).</p></section>`;

/* ---------- rute ---------- */
const menuAktif={beranda:'beranda',cek:'beranda',pahami:'pahami',video:'pahami',baca:'pahami',penularan:'penularan',saran:'saran'};
function gambar(){
 const r=(location.hash.slice(1)||'beranda');
 const v=r==='barcode'?halQR():r==='petugas'?halPetugas():r==='beranda'?beranda():r==='cek'?halCek():r==='pahami'?halPahami():r==='video'?halVideo():r==='baca'?halBaca():r.startsWith('bab-')?halBab(r.slice(4)):r==='penularan'?halPenularan():r==='saran'?halSaran():r==='sumber'?halSumber():beranda();
 utama.innerHTML=v;if(r==='barcode')pasangQR();
 const m=menuAktif[r]||(r.startsWith('bab-')?'pahami':'');
 document.querySelectorAll('[data-m-nav]').forEach(a=>{if(a.dataset.mNav===m)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
}
utama.addEventListener('input',e=>{const t=e.target;
 if(t.id==='thn'){const y=+t.value,el=document.getElementById('rentang');if(y>=1950&&y<=new Date().getFullYear())el.innerHTML=`<b>Kemungkinan tertular: sekitar ${y-10} sampai ${y}.</b>`;return}
 if(t.closest('#f')){if(t.type==='checkbox')sesi.j[t.name]=t.checked;else if(t.type==='radio'){if(t.checked)sesi.j[t.name]=t.value}else sesi.j[t.name]=t.value.trim?t.value:t.value;
  if(t.id==='lahir'){const u=hitungUsia(t.value),s=t.parentElement.querySelector('small')||t.parentElement.appendChild(document.createElement('small'));s.textContent=u!==null?`Usia: ${u} tahun`:''}
  if(t.type==='radio'&&sesi.tahap==='soal')setTimeout(()=>{if(sesi.j[t.name]===t.value)maju()},260)}
 if(t.name==='mudah')saran.mudah=t.value;
});
utama.addEventListener('submit',e=>{e.preventDefault();
 if(e.target.id==='fs'){kirimSaran();return}
 const g=validasi(),el=document.getElementById('galat');if(g.length){el.textContent=g[0];el.hidden=false;return}maju()});
utama.addEventListener('click',e=>{const t=e.target,b=t.closest('button');if(!b)return;
 if(b.dataset.aksi==='mundur')mundur();
 if(b.dataset.aksi==='ulang'){sesi.tahap='setuju';sesi.i=0;sesi.j={};sesi.t='hasil';sesi.simpan='';gambar();scrollTo(0,0)}
 if(b.dataset.aksi==='salin'){const i=document.getElementById('info'),gagal=()=>{const s=getSelection(),r=document.createRange();r.selectNodeContents(document.getElementById('ringkas'));s.removeAllRanges();s.addRange(r);i.textContent='Teks sudah dipilih. Salin secara manual.'};
  if(navigator.clipboard)navigator.clipboard.writeText(sesi.salin).then(()=>{i.textContent='Ringkasan tersalin.'}).catch(gagal);else gagal()}
 if(b.dataset.tab){sesi.t=b.dataset.tab;gambar();scrollTo(0,0)}
 if(b.classList.contains('buka')){const o=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',!o);b.nextElementSibling.hidden=o}
 if(b.classList.contains('foto-t'))tampilFoto(b.parentElement,b.parentElement.dataset.foto);
 if(b.classList.contains('balik')){const on=b.getAttribute('aria-pressed')==='true',m=MITOS[+b.dataset.m];b.setAttribute('aria-pressed',!on);b.querySelector('.sisi').textContent=m[on?0:1]}
 if(b.dataset.b){saran.b=+b.dataset.b;saran.teks=document.getElementById('stk').value;document.querySelectorAll('.bintang button').forEach(x=>x.classList.toggle('on',+x.dataset.b<=saran.b))}
});
addEventListener('hashchange',()=>{gambar();scrollTo(0,0)});
gambar();
</script>
</body>
</html>
